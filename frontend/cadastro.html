<script>

  const API_URL = "http://localhost:8080";

  // Popula o <select> assim que a página carrega, buscando os dados na API
  window.addEventListener("DOMContentLoaded", function () {
    fetch(`${API_URL}/generos-literarios`)
      .then(resposta => resposta.json())
      .then(function (lista) {
        const select = document.getElementById("genero_literario_select");
        lista.forEach(function (genero) {
          const option = document.createElement("option");
          option.value = genero.id;
          option.textContent = genero.nome;
          select.appendChild(option);
        });
      })
      .catch(function (erro) {
        console.log("Erro ao carregar gêneros literários: ", erro);
      });
  });

  function mostrarErro(mensagem) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = mensagem;
  }

  function cadastrar() {
    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var dtNascVar = dtNasc_input.value;
    var idadeVar = idade_input.value;
    var senhaVar = senha_input.value;
    var confSenhaVar = confSenha_input.value;
    var generoInput = document.querySelector('input[name="genero"]:checked');
    var newsletterVar = newsletter_input.checked;
    var generoLiterarioVar = genero_literario_select.value;

    // Validação client-side (não substitui a validação do back-end)
    if (nomeVar === "" || emailVar === "" || senhaVar === "" || dtNascVar === "" || idadeVar === "") {
      mostrarErro("Preencha todos os campos obrigatórios.");
      return false;
    }
    if (!/^[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}$/.test(emailVar)) {
      mostrarErro("Digite um e-mail válido.");
      return false;
    }
    if (Number(idadeVar) <= 0) {
      mostrarErro("Digite uma idade válida.");
      return false;
    }
    if (!generoInput) {
      mostrarErro("Selecione um gênero.");
      return false;
    }
    if (senhaVar.length < 6) {
      mostrarErro("A senha deve ter pelo menos 6 caracteres.");
      return false;
    }
    if (senhaVar !== confSenhaVar) {
      mostrarErro("As senhas não coincidem.");
      return false;
    }

    // Envia os dados para a API (nomes dos campos batem com Usuario.java)
    fetch(`${API_URL}/usuarios/cadastrar`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nome: nomeVar,
        email: emailVar,
        senha: senhaVar,
        dtNascimento: dtNascVar,
        idade: Number(idadeVar),
        genero: generoInput.value,
        aceitaNewsletter: newsletterVar,
        generoLiterarioId: Number(generoLiterarioVar)
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          alert('Cadastro realizado com sucesso! Redirecionando para tela de Login...');
          setTimeout(() => {
            window.location = "login.html";
          }, 1000);
        } else {
          resposta.text().then(function (texto) {
            mostrarErro(texto || "Houve um erro ao tentar realizar o cadastro!");
          });
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        mostrarErro("Não foi possível conectar ao servidor.");
      });

    return false;
  }
</script>
